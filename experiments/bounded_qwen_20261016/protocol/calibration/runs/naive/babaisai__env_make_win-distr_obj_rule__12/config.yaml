agent:
  type: naive
  remember_cot: true
  max_text_history: 16
  max_image_history: 0
  max_cot_history: 1
  max_icl_history: 1000
  cache_icl: false
eval:
  output_dir: results
  resume_from: null
  num_workers: 1
  num_episodes:
    nle: 5
    minihack: 5
    babyai: 10
    crafter: 10
    babaisai: 1
    textworld: 10
  max_steps_per_episode: null
  save_trajectories: true
  save_images: false
  icl_episodes: 1
  icl_dataset: records
  feedback_on_invalid_action: true
client:
  client_name: vllm
  model_id: Qwen/Qwen3-4B-Instruct-2507-FP8
  base_url: http://127.0.0.1:8088/v1
  generate_kwargs:
    temperature: null
    max_tokens: 128
    thinking_budget: null
  timeout: 60
  max_retries: 0
  delay: 2
  alternate_roles: false
envs:
  names: babaisai
  env_kwargs:
    seed: 12
  nle_kwargs:
    character: '@'
    max_episode_steps: 100000
    no_progress_timeout: 150
    savedir: null
    save_ttyrec_every: 0
    skip_more: true
  minihack_kwargs:
    character: '@'
    max_episode_steps: 100
    penalty_step: -0.01
    penalty_time: 0.0
    penalty_mode: constant
    savedir: null
    save_ttyrec_every: 0
    autopickup: false
    skip_more: true
  babyai_kwargs:
    num_dists: 0
  crafter_kwargs:
    area:
    - 64
    - 64
    view:
    - 9
    - 9
    size:
    - 256
    - 256
    reward: true
    seed: 12
    max_episode_steps: 2000
    unique_items: true
    precise_location: false
    skip_items: []
    edge_only_items: []
  textworld_kwargs:
    objective: true
    description: true
    score: true
    max_score: true
    won: true
    max_episode_steps: 80
    textworld_games_path: tw_games
  babaisai_kwargs:
    add_ruleset: true
tasks:
  nle_tasks:
  - NetHackChallenge-v0
  minihack_tasks:
  - MiniHack-Boxoban-Hard-v0
  - MiniHack-Boxoban-Medium-v0
  - MiniHack-MazeWalk-9x9-v0
  - MiniHack-MazeWalk-15x15-v0
  - MiniHack-Corridor-R3-v0
  - MiniHack-CorridorBattle-Dark-v0
  - MiniHack-Quest-Easy-v0
  - MiniHack-Quest-Medium-v0
  crafter_tasks:
  - default
  babyai_tasks:
  - BabyAI-MixedTrainLocal-v0/goto
  - BabyAI-MixedTrainLocal-v0/pickup
  - BabyAI-MixedTrainLocal-v0/open
  - BabyAI-MixedTrainLocal-v0/putnext
  - BabyAI-MixedTrainLocal-v0/pick_up_seq_go_to
  textworld_tasks:
  - treasure_hunter
  - the_cooking_game
  - coin_collector
  babaisai_tasks:
  - env/make_win-distr_obj_rule
hydra:
  run:
    dir: .
  output_subdir: null
